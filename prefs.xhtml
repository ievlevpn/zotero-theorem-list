<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
	<groupbox>
		<html:h2>Environments</html:h2>
		<html:p class="tl-hint">Lines starting with one of these words are collected into
			the list, and each gets a colored stripe. Matching ignores case, and keywords
			can be in any language — add <html:em>Лемма</html:em> or
			<html:em>Utsagn</html:em> alongside the defaults.</html:p>
		<html:table id="tl-table">
			<html:tbody id="tl-rows"/>
		</html:table>
		<html:div class="tl-actions">
			<html:button id="tl-add" type="button">Add keyword</html:button>
			<html:button id="tl-reset" type="button">Reset to defaults</html:button>
		</html:div>
	</groupbox>
</vbox>
